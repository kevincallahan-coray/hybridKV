# RULER sanity check for the hybrid harness (Llama-3.1-8B-Instruct, 4K, 100 ex).
# `full` must reproduce the dense SDPA scores from adaptive-SANTA on the same
# data (fwe 84.67, niah_multivalue 100, qa_1 90); SnapKV and two
# matched-traffic hybrids give a first look.  One indexed pod per task.
# Results: /shared/ruler/results/hybridkv/validate_4096/<task>/
apiVersion: batch/v1
kind: Job
metadata:
  name: hybridkv-validate-ruler4k
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimitPerIndex: 1
  maxFailedIndexes: 4
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["20000"]
                  - key: nvidia.com/gpu.compute.major
                    operator: Gt
                    values: ["7"]
      initContainers:
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/hybridKV.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              TASKS=(fwe niah_multivalue qa_1 qa_2)
              TASK=${TASKS[$JOB_COMPLETION_INDEX]}
              DATA=/shared/ruler/data/4096_100/$TASK/validation.jsonl
              OUT=/shared/ruler/results/hybridkv/validate_4096/$TASK
              test -f "$DATA"
              mkdir -p "$OUT"
              source /repo/setup_env.sh
              cd /repo
              python run_hybrid.py --benchmark ruler --mode e2e \
                --dataset "$DATA" --task "$TASK" --output-dir "$OUT" \
                --model "$MODEL" --max-examples 100 --max-input-tokens 4096 \
                --window 32 --kernel 7 --pool max \
                --methods "full,snap1024,snap2048,snap1536+sys128,snap1536+top128"
          env:
            - name: MODEL
              value: meta-llama/Meta-Llama-3.1-8B-Instruct
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /tmp/hf
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "2"
              memory: 24Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: shared
              mountPath: /shared
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: shared
          persistentVolumeClaim:
            claimName: kevin-ruler-shared
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
