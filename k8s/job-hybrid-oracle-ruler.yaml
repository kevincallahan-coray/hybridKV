# Phase 1 "merit" test: operator-level error vs K+V row traffic.
# Dense trajectory; at every decode step and layer each variant's attention
# output is compared to exact.  One indexed pod per RULER task (4K, already on
# the shared PVC).  Results: /shared/ruler/results/hybridkv/oracle_4096/<task>/
apiVersion: batch/v1
kind: Job
metadata:
  name: hybridkv-oracle-ruler4k
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimitPerIndex: 1
  maxFailedIndexes: 4
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.memory
                    operator: Gt
                    values: ["20000"]
                  - key: nvidia.com/gpu.compute.major
                    operator: Gt
                    values: ["7"]
      initContainers:
        - name: clone
          image: alpine/git
          command: ["sh", "-c"]
          args:
            - git clone --depth 1 https://github.com/kevincallahan-coray/hybridKV.git /repo
          volumeMounts:
            - name: repo
              mountPath: /repo
          resources:
            requests:
              cpu: "250m"
              memory: 256Mi
            limits:
              cpu: "250m"
              memory: 256Mi
      containers:
        - name: run
          image: gitlab-registry.nrp-nautilus.io/prp/jupyter-stack/prp
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              TASKS=(fwe niah_multivalue qa_1 qa_2)
              TASK=${TASKS[$JOB_COMPLETION_INDEX]}
              DATA=/shared/ruler/data/4096_100/$TASK/validation.jsonl
              OUT=/shared/ruler/results/hybridkv/oracle_4096/$TASK
              test -f "$DATA"
              mkdir -p "$OUT"
              source /repo/setup_env.sh
              cd /repo
              # SnapKV-only curve, the full-K SANTA curve, and hybrids
              # (bigger K budget + sampled/top-m V) at overlapping traffic.
              METHODS="full,snap128,snap256,snap384,snap512,snap768,snap1024,snap1536,snap2048"
              for B in 256 512 1024 2048; do
                for S in 16 32 64 128 256; do
                  METHODS="$METHODS,snap$B+sys$S,snap$B+top$S"
                done
              done
              METHODS="$METHODS,full+sys64,full+sys128,full+sys256,full+top64,full+top128,full+top256,snap1024+sys64-mid,snap1024+sys128-mid"
              python run_hybrid.py --benchmark ruler --mode oracle \
                --dataset "$DATA" --task "$TASK" --output-dir "$OUT" \
                --model "$MODEL" --max-examples 25 --max-input-tokens 4096 \
                --oracle-steps 24 --window 32 --kernel 7 --pool max \
                --methods "$METHODS"
          env:
            - name: MODEL
              value: meta-llama/Meta-Llama-3.1-8B-Instruct
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: HF_HOME
              value: /tmp/hf
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
          resources:
            requests:
              cpu: "4"
              memory: 28Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: repo
              mountPath: /repo
            - name: shared
              mountPath: /shared
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: repo
          emptyDir: {}
        - name: shared
          persistentVolumeClaim:
            claimName: kevin-ruler-shared
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
